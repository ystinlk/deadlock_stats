<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль игрока</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
    <nav>
        <a href="../index.html">Герои</a>
        <a href="leader-board.html">Таблица лидеров</a>
        <a href="steam_finder.html">Поиск Steam</a>
        <button id="profile-btn">Войти</button>
    </nav>
    <div class="profile-container">
        <div class="profile-header">
            <img id="profile-avatar" src="" alt="avatar">
            <div class="profile-info">
                <h2 id="profile-name">Загрузка...</h2>
                <span id="profile-id"></span>
            </div>
        </div>
        <div class="profile-stats">
            <div class="stat-card">
                <div class="stat-value" id="total-matches">—</div>
                <div class="stat-label">Матчей</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="winrate">—</div>
                <div class="stat-label">Винрейт</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avg-kda">—</div>
                <div class="stat-label">KDA</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avg-networth">—</div>
                <div class="stat-label">Avg нетворс</div>
            </div>
        </div>
        <h3 class="section-title">История матчей</h3>
        <table>
            <thead>
                <tr>
                    <th>Герой</th>
                    <th>Результат</th>
                    <th>KDA</th>
                    <th>Нетворс</th>
                    <th>Длительность</th>
                </tr>
            </thead>
            <tbody id="match-history"></tbody>
        </table>
    </div>
    <button id="scroll-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">&#8593;</button>
    <script type="module" src="../js/profile.js"></script>
</body>
</html>
